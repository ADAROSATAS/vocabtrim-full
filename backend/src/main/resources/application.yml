spring:
  application:
    name: vocabtrim-full
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vocabtrim?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:vocabtrim}
    password: ${DB_PASSWORD:vocabtrim}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD}  # 必须提供 redis 密码
      connect-timeout: 2s
      timeout: 2s
  session:
    data:
      redis:
        namespace: vocabtrim:session:v1

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: VOCABTRIM_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

logging:
  level:
    root: INFO
    com.adarosatas.vocabtrim: INFO
