name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vocabtrim_test
          MYSQL_USER: vocabtrim
          MYSQL_PASSWORD: ci-mysql-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pci-root-only"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.2.9-alpine
        env:
          REDISCLI_AUTH: ci-redis-only
        options: >-
          --health-cmd "redis-cli ping | grep -qx PONG"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:mysql://mysql:3306/vocabtrim_test?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: vocabtrim
      DB_PASSWORD: ci-mysql-only
      REDIS_HOST: redis
      REDIS_PASSWORD: ci-redis-only
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure disposable Redis service
        run: |
          # Service containers cannot override the Redis command; configure it before tests.
          apt-get update && apt-get install -y --no-install-recommends redis-tools
          redis-cli -e -h redis CONFIG SET save "" appendonly no requirepass "$REDIS_PASSWORD"
      - name: Test backend
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test:run
      - name: Build
        working-directory: frontend
        run: npm run build
